<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixtape — Test Console</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --fg:#e6e9ef; --muted:#9aa4b2; --accent:#7c9cff; --good:#4ade80; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; }
  header .who { margin-left:auto; display:flex; align-items:center; gap:8px; }
  select, input, button { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  button { cursor:pointer; background:#242833; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#0b0d12; border-color:var(--accent); font-weight:600; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding:24px; max-width:1400px; }
  @media (max-width:1000px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h2 { margin:0 0 12px; font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .song { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .song .title { font-weight:600; }
  .song .meta { color:var(--muted); font-size:13px; }
  .tag { display:inline-block; background:#2a2f3a; color:var(--muted); border-radius:999px; padding:1px 8px; font-size:11px; margin-right:4px; }
  .notif { border-left:3px solid var(--line); padding:6px 10px; margin-bottom:6px; }
  .notif.unread { border-left-color:var(--accent); }
  #log { grid-column:1/-1; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:12px; max-height:320px; overflow:auto; background:#0b0d12; border-radius:8px; padding:12px; border:1px solid var(--line); }
  .status { font-size:12px; padding:2px 8px; border-radius:6px; }
  .status.ok { background:rgba(74,222,128,.15); color:var(--good); }
  .status.err { background:rgba(248,113,113,.15); color:var(--bad); }
  .muted { color:var(--muted); font-size:13px; }
  small.hint { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🎵 Mixtape — Test Console</h1>
  <small class="hint">A harness for exercising the live API. Watch the response log to spot bugs.</small>
  <div class="who">
    <label for="userSel">Acting as:</label>
    <select id="userSel"></select>
  </div>
</header>

<main>
  <!-- Profile & Streak -->
  <section class="card">
    <h2>Profile &amp; Streak</h2>
    <div class="row">
      <button onclick="loadProfile()">Get profile</button>
      <button onclick="loadStreak()">Get streak</button>
      <button onclick="loadHistory()">Listening history</button>
    </div>
    <div id="profileOut" class="muted">—</div>
  </section>

  <!-- Feed -->
  <section class="card">
    <h2>Friends Feed</h2>
    <div class="row">
      <button onclick="feed('listening-now')">Listening now (24h)</button>
      <button onclick="feed('activity')">Activity feed</button>
    </div>
    <div id="feedOut" class="muted">—</div>
  </section>

  <!-- Search + song actions -->
  <section class="card">
    <h2>Search Songs</h2>
    <div class="row">
      <input id="q" placeholder="title or artist…" style="flex:1" onkeydown="if(event.key==='Enter')search()">
      <button class="primary" onclick="search()">Search</button>
    </div>
    <div id="searchOut" class="muted">Search to list songs, then Listen / Rate / Add to a playlist.</div>
  </section>

  <!-- Playlists -->
  <section class="card">
    <h2>Playlists</h2>
    <div class="row">
      <select id="plSel" style="flex:1"></select>
      <button onclick="plSongs()">View songs</button>
      <button onclick="plDetail()">Detail</button>
    </div>
    <div class="row">
      <input id="plName" placeholder="new playlist name…" style="flex:1">
      <label class="muted"><input type="checkbox" id="plCollab" checked> collaborative</label>
      <button onclick="createPlaylist()">Create</button>
    </div>
    <div id="plOut" class="muted">—</div>
  </section>

  <!-- Notifications -->
  <section class="card">
    <h2>Notifications</h2>
    <div class="row">
      <button onclick="notifs(false)">All</button>
      <button onclick="notifs(true)">Unread only</button>
    </div>
    <div id="notifOut" class="muted">—</div>
  </section>

  <!-- Raw response log -->
  <section class="card" id="log">
    <h2>Response log <span id="lastStatus"></span></h2>
    <div class="row"><small class="hint" id="lastReq">No requests yet.</small></div>
    <pre id="logBody">—</pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const userId = () => $('userSel').value;
const playlistId = () => $('plSel').value;

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  let res, data;
  try {
    res = await fetch(path, opts);
    data = await res.json();
  } catch (e) {
    $('lastStatus').innerHTML = '<span class="status err">network error</span>';
    $('lastReq').textContent = `${method} ${path}`;
    $('logBody').textContent = String(e);
    throw e;
  }
  $('lastStatus').innerHTML = `<span class="status ${res.ok ? 'ok' : 'err'}">${res.status}</span>`;
  $('lastReq').textContent = `${method} ${path}` + (body ? `  •  body: ${JSON.stringify(body)}` : '');
  $('logBody').textContent = JSON.stringify(data, null, 2);
  return { res, data };
}

async function bootstrap() {
  const { data } = await api('GET', '/dev/bootstrap');
  $('userSel').innerHTML = data.users.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
  $('plSel').innerHTML = data.playlists.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
}

async function loadProfile() {
  const { data } = await api('GET', `/users/${userId()}`);
  if (!data.username) { $('profileOut').innerHTML = JSON.stringify(data); return; }
  const { data: fr } = await api('GET', `/dev/friends/${userId()}`);
  const friends = (fr.friends || []).map(f => `<span class="tag">${f.username}</span>`).join('') || '<span class="muted">none</span>';
  $('profileOut').innerHTML =
    `<b>${data.username}</b> — streak: ${data.listening_streak}, last listened: ${data.last_listened_at || 'never'}` +
    `<div style="margin-top:8px" class="muted">Friends (${fr.count}): ${friends}</div>`;
}
async function loadStreak() {
  const { data } = await api('GET', `/users/${userId()}/streak`);
  $('profileOut').innerHTML = `Streak: <b>${data.streak}</b>`;
}
async function loadHistory() {
  const { data } = await api('GET', `/dev/listening/${userId()}`);
  const items = data.history || [];
  $('profileOut').innerHTML = `<div class="muted" style="margin-bottom:8px">Listened to ${data.count} song(s), most recent first:</div>` +
    (items.length
      ? items.map(h => `<div class="song"><span class="title">${h.song ? h.song.title : '(deleted song)'}</span> <span class="meta">${h.song ? '— ' + h.song.artist : ''} · ${h.listened_at}</span></div>`).join('')
      : '<span class="muted">No listening history yet.</span>');
}

async function feed(kind) {
  const { data } = await api('GET', `/feed/${userId()}/${kind}`);
  const items = data.feed || [];
  $('feedOut').innerHTML = items.length
    ? items.map(e => `<div class="song"><span class="title">${e.friend.username}</span> — ${e.song.title} <span class="meta">by ${e.song.artist} · ${e.listened_at}</span></div>`).join('')
    : `<span class="muted">Empty (count: ${data.count ?? 0})</span>`;
}

function songCard(s) {
  const tags = (s.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  const pls = $('plSel').innerHTML;
  return `<div class="song">
    <div class="title">${s.title} <span class="meta">— ${s.artist}${s.album ? ' · ' + s.album : ''}</span></div>
    <div>${tags || '<span class="muted">no tags</span>'}</div>
    <div class="row" style="margin-top:8px">
      <button onclick="listen('${s.id}')">▶ Listen</button>
      <input type="number" min="1" max="5" value="5" id="score-${s.id}" style="width:60px">
      <button onclick="rate('${s.id}')">★ Rate</button>
      <select id="addpl-${s.id}">${pls}</select>
      <button onclick="addToPlaylist('${s.id}')">+ Playlist</button>
    </div>
  </div>`;
}

async function search() {
  const { data } = await api('GET', `/songs/search?q=${encodeURIComponent($('q').value)}`);
  const items = data.results || [];
  $('searchOut').innerHTML = items.length
    ? `<div class="muted" style="margin-bottom:8px">count: ${data.count}</div>` + items.map(songCard).join('')
    : `<span class="muted">No results (count: ${data.count ?? 0})</span>`;
}

async function listen(songId) { await api('POST', `/songs/${songId}/listen`, { user_id: userId() }); }
async function rate(songId) {
  const score = Number($(`score-${songId}`).value);
  await api('POST', `/songs/${songId}/rate`, { user_id: userId(), score });
}
async function addToPlaylist(songId) {
  const pid = $(`addpl-${songId}`).value;
  await api('POST', `/playlists/${pid}/songs`, { song_id: songId, added_by: userId() });
}

async function plSongs() {
  const { data } = await api('GET', `/playlists/${playlistId()}/songs`);
  const items = data.songs || [];
  $('plOut').innerHTML = `<div class="muted" style="margin-bottom:8px">count: ${data.count}</div>` +
    (items.length ? items.map((s,i) => `<div class="song"><span class="meta">${i+1}.</span> <span class="title">${s.title}</span> <span class="meta">— ${s.artist}</span></div>`).join('') : '<span class="muted">empty</span>');
}
async function plDetail() {
  const { data } = await api('GET', `/playlists/${playlistId()}`);
  $('plOut').innerHTML = `<b>${data.name}</b> — collaborative: ${data.is_collaborative}, created: ${data.created_at}`;
}
async function createPlaylist() {
  const name = $('plName').value.trim();
  if (!name) return;
  await api('POST', '/playlists/', { name, created_by: userId(), is_collaborative: $('plCollab').checked });
  $('plName').value = '';
  await bootstrap();
}

async function notifs(unread) {
  const { data } = await api('GET', `/users/${userId()}/notifications?unread_only=${unread}`);
  const items = data.notifications || [];
  $('notifOut').innerHTML = items.length
    ? items.map(n => `<div class="notif ${n.read ? '' : 'unread'}">
        <div>${n.body}</div>
        <div class="row" style="margin-top:4px"><span class="tag">${n.type}</span>${n.read ? '<span class="muted">read</span>' : `<button onclick="markRead('${n.id}')">Mark read</button>`}</div>
      </div>`).join('')
    : `<span class="muted">None (count: ${data.count ?? 0})</span>`;
}
async function markRead(nid) {
  await api('POST', `/users/notifications/${nid}/read`);
  notifs(false);
}

bootstrap();
</script>
</body>
</html>
